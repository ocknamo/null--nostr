<head>

    <title>ぬるぬる - Nostr クライアント</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            padding: 40px 20px;
        }
        .app-icon {
            width: 160px;
            height: 160px;
            border-radius: 36px;
            object-fit: cover;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .app-name {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }
        .store-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            align-items: center;
        }
        .store-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            border-radius: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: background 0.2s, border-color 0.2s;
        }
        .store-btn:hover {
            background: #2a2a2a;
            border-color: #555;
        }
        .store-btn svg {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }
        .grant-info {
            max-width: 560px;
            color: #ddd;
            font-size: 0.95rem;
            line-height: 1.7;
            text-align: center;
        }
        .grant-info a {
            color: #fff;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .footer-links {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            align-items: center;
        }
        .privacy-link {
            font-size: 0.875rem;
            color: #555;
            text-decoration: none;
            border-bottom: 1px solid #333;
            padding-bottom: 2px;
            transition: color 0.2s;
        }
        .privacy-link:hover { color: #aaa; }
    </style>
</head>
