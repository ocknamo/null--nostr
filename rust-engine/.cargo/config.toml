[target.x86_64-linux-android]
linker = "/home/n/Android/Sdk/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang"
ar = "/home/n/Android/Sdk/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"

# iOS: align Rust link target version with current Apple SDK objects.
# Prevents linker issues like missing ___chkstk_darwin caused by 10.0 link target.
[target.aarch64-apple-ios]
rustflags = [
  "-C", "link-arg=-target",
  "-C", "link-arg=arm64-apple-ios16.0.0",
  "-C", "link-arg=-miphoneos-version-min=16.0"
]

[target.aarch64-apple-ios-sim]
rustflags = [
  "-C", "link-arg=-target",
  "-C", "link-arg=arm64-apple-ios16.0.0-simulator",
  "-C", "link-arg=-mios-simulator-version-min=16.0"
]

[target.x86_64-apple-ios]
rustflags = [
  "-C", "link-arg=-target",
  "-C", "link-arg=x86_64-apple-ios16.0.0-simulator",
  "-C", "link-arg=-mios-simulator-version-min=16.0"
]
