[target.aarch64-linux-android]
linker = "aarch64-linux-android35-clang"
ar = "llvm-ar"
# Android 15+ can run with 16 KB memory pages. Force native Android
# Rust libraries to use 16 KB max page size so LOAD segments are compatible
# with both 4 KB and 16 KB page-size devices.
rustflags = [
  "-C", "link-arg=-Wl,-z,max-page-size=16384"
]

[env]
CC_aarch64_linux_android = "aarch64-linux-android35-clang"
AR_aarch64_linux_android = "llvm-ar"
RANLIB_aarch64_linux_android = "llvm-ranlib"

[target.x86_64-linux-android]
linker = "x86_64-linux-android35-clang"
ar = "llvm-ar"
# Same 16 KB page-size compatibility for emulator/native test builds.
rustflags = [
  "-C", "link-arg=-Wl,-z,max-page-size=16384"
]

# iOS: align Rust link target version with current Apple SDK objects.
# Prevents linker issues like missing ___chkstk_darwin caused by 10.0 link target.
[target.aarch64-apple-ios]
rustflags = [
  "-C", "link-arg=-target",
  "-C", "link-arg=arm64-apple-ios16.0.0",
  "-C", "link-arg=-miphoneos-version-min=16.0"
]

[target.aarch64-apple-ios-sim]
rustflags = [
  "-C", "link-arg=-target",
  "-C", "link-arg=arm64-apple-ios16.0.0-simulator",
  "-C", "link-arg=-mios-simulator-version-min=16.0"
]

[target.x86_64-apple-ios]
rustflags = [
  "-C", "link-arg=-target",
  "-C", "link-arg=x86_64-apple-ios16.0.0-simulator",
  "-C", "link-arg=-mios-simulator-version-min=16.0"
]
