[workspace]
members = ["nurunuru-core", "nurunuru-ffi", "nurunuru-napi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["NuruNuru Team"]
description = "High-performance Nostr engine for the NuruNuru client"

[workspace.dependencies]
nostr-sdk = { version = "0.44", features = ["all-nips"] }
nostr = "0.44"
nostr-ndb = "0.44"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
# MIP-01 v3 (disappearing_message_secs) support is not in crates.io 0.7.1 yet.
# Pin MDK crates to upstream git commit from branch:
#   disappearing-messages-1-extension-v3
# commit: e19dedf8b7b2e1d705de750e0513b69ebeb3a690
mdk-core = { git = "https://github.com/marmot-protocol/mdk.git", rev = "e19dedf8b7b2e1d705de750e0513b69ebeb3a690", package = "mdk-core" }
mdk-sqlite-storage = { git = "https://github.com/marmot-protocol/mdk.git", rev = "e19dedf8b7b2e1d705de750e0513b69ebeb3a690", package = "mdk-sqlite-storage" }
mdk-storage-traits = { git = "https://github.com/marmot-protocol/mdk.git", rev = "e19dedf8b7b2e1d705de750e0513b69ebeb3a690", package = "mdk-storage-traits" }
hex = "0.4"
base64 = "0.22"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
